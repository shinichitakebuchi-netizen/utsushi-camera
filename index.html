<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>写 UTSUSHI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="写">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--acc:#ff7a1a;--fg:#f2f0eb;--dim:#8a8780;--line:#2e2e2e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:8px}
.brand{white-space:nowrap;font-size:14px;font-weight:600;letter-spacing:.22em;display:flex;align-items:center;gap:8px}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--acc);display:inline-block}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{background:none;border:1px solid var(--line);color:var(--dim);border-radius:16px;padding:5px 11px;font-size:11px;letter-spacing:.08em}
.pill.on{border-color:var(--acc);color:var(--acc)}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
#view{display:block;background:#0c0c0c}
#grid{position:absolute;pointer-events:none;display:none}
#grid.on{display:block}
#grid::before{content:"";position:absolute;left:33.333%;width:33.333%;top:0;height:100%;border-left:1px solid rgba(255,255,255,.28);border-right:1px solid rgba(255,255,255,.28)}
#grid::after{content:"";position:absolute;top:33.333%;height:33.333%;left:0;width:100%;border-top:1px solid rgba(255,255,255,.28);border-bottom:1px solid rgba(255,255,255,.28)}
#flash{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .18s}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:13px;line-height:1.8;color:var(--dim)}
#msg button{margin-top:14px;background:var(--acc);color:#000;border:none;border-radius:20px;padding:10px 22px;font-weight:600}
#zoom{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
#zoom button{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);color:var(--fg);font-size:11px}
#zoom button.on{color:var(--acc);border-color:var(--acc)}
.looks{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 6px;scrollbar-width:none}
.looks::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:18px;border:1px solid var(--line);font-size:11px;letter-spacing:.14em;color:var(--dim);background:none}
.chip.on{color:#000;background:var(--fg);border-color:var(--fg)}
#tip{padding:0 18px 6px;font-size:11px;color:var(--dim);letter-spacing:.04em;min-height:18px}
#level{position:absolute;left:50%;top:50%;width:120px;height:0;border-top:2px solid rgba(255,255,255,.7);transform:translate(-50%,-50%);pointer-events:none;display:none;transition:border-color .2s}
#level.ok{border-top-color:var(--acc)}
.row{display:flex;align-items:center;gap:10px;padding:4px 18px;font-size:11px;color:var(--dim);letter-spacing:.08em}
.row input{flex:1;accent-color:var(--acc)}
.row span.v{width:38px;text-align:right;color:var(--fg)}
.controls{display:flex;align-items:center;justify-content:space-between;padding:10px 34px 18px}
#thumb{width:54px;height:54px;border-radius:10px;background:#161616 center/cover no-repeat;border:1px solid var(--line)}
#shutter{width:78px;height:78px;border-radius:50%;border:4px solid var(--fg);background:none;position:relative}
#shutter::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--fg);transition:transform .1s}
#shutter:active::after{transform:scale(.88)}
#shutter.busy::after{background:var(--acc)}
.round{width:54px;height:54px;border-radius:50%;background:#161616;border:1px solid var(--line);color:var(--fg);font-size:20px}
#editor{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:12;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#editor.on{display:flex}
.ebar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
.ebar button{background:#1a1a1a;color:var(--fg);border:1px solid var(--line);border-radius:18px;padding:8px 16px;font-size:12px}
.ebar button.pri{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}
#einfo{font-size:11px;color:var(--dim);letter-spacing:.06em}
.ewrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;touch-action:none}
#ecv{display:block}
#ename{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;letter-spacing:.25em;font-weight:600;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6);opacity:0;transition:opacity .35s;pointer-events:none;white-space:nowrap}
#ebusy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);font-size:13px;letter-spacing:.1em}
.ehint{text-align:center;font-size:10px;color:var(--dim);padding:6px 0 0;letter-spacing:.04em}
#etip{padding:0 18px 4px;font-size:11px;color:var(--dim);min-height:16px}
.eopts{display:flex;gap:6px;justify-content:center;padding:6px 0 14px}
#viewer{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:10;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#viewer.on{display:flex}
#viewer .imgwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:10px}
#viewer img{max-width:100%;max-height:100%;object-fit:contain}
#viewer .bar{display:flex;gap:8px;justify-content:center;padding:12px;flex-wrap:wrap}
#viewer .bar button{background:#1a1a1a;color:var(--fg);border:1px solid var(--line);border-radius:20px;padding:10px 16px;font-size:12px}
#viewer .bar button.pri{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}
#vinfo{text-align:center;font-size:11px;color:var(--dim);letter-spacing:.1em}
#toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:rgba(30,30,30,.92);color:var(--fg);padding:8px 16px;border-radius:16px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><i></i>写 UTSUSHI<small style="font-size:9px;color:var(--dim);letter-spacing:.05em;font-weight:400">v8</small></div>
    <div class="hbtns">
      <button class="pill" id="autoBtn">AUTO</button>
      <button class="pill" id="aspectBtn">3:2</button>
      <button class="pill" id="resBtn">MAX</button>
      <button class="pill" id="gridBtn">GRID</button>
      <button class="pill" id="filmBtn">FILM</button>
      <button class="pill" id="frameBtn">FRAME</button>
      <button class="pill" id="importBtn">読込</button>
    </div>
  </header>
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="grid"></div>
    <div id="level"></div>
    <div id="flash"></div>
    <div id="zoom"></div>
    <div id="msg">カメラを起動中…</div>
  </div>
  <div class="looks" id="looks"></div>
  <div id="tip"></div>
  <div class="row">EV <input type="range" id="ev" min="-1.5" max="1.5" step="0.1" value="0"><span class="v" id="evv">±0.0</span></div>
  <div class="controls">
    <button id="thumb" aria-label="写真"></button>
    <button id="shutter" aria-label="撮影"></button>
    <button class="round" id="flip" aria-label="カメラ切替">⟲</button>
  </div>
</div>

<div id="editor">
  <div class="ebar">
    <button id="ecancel">キャンセル</button>
    <div id="einfo"></div>
    <button class="pri" id="esave">保存</button>
  </div>
  <div class="ewrap" id="ewrap">
    <canvas id="ecv"></canvas>
    <div id="ename"></div>
    <div id="ebusy">保存中…</div>
  </div>
  <div class="ehint">← 左右にスワイプで色味を切替 ／ 長押しで元の写真 →</div>
  <div class="looks" id="elooks"></div>
  <div id="etip"></div>
  <div class="row">EV <input type="range" id="eev" min="-1.5" max="1.5" step="0.1" value="0"><span class="v" id="eevv">±0.0</span></div>
  <div class="eopts">
    <button class="pill" id="eauto">AUTO</button>
    <button class="pill" id="efilm">FILM</button>
    <button class="pill" id="eframe">FRAME</button>
    <button class="pill" id="easp">3:2</button>
  </div>
</div>
<div id="viewer">
  <div class="imgwrap"><img id="vimg" alt=""></div>
  <div id="vinfo"></div>
  <div class="bar">
    <button id="vprev">‹</button>
    <button class="pri" id="vshare">共有 / 保存</button>
    <button id="vdl">ダウンロード</button>
    <button id="vnext">›</button>
    <button id="vclose">閉じる</button>
  </div>
</div>
<div id="toast"></div>
<video id="video" playsinline muted autoplay style="display:none"></video>
<input type="file" id="file" accept="image/*" multiple style="display:none">

// ===== Shader =====
const VS=`attribute vec2 p;varying vec2 v_uv;void main(){v_uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const FS=`precision highp float;
varying vec2 v_uv;
uniform sampler2D u_tex,u_lut;
uniform vec4 u_crop;
uniform float u_look,u_nlooks,u_exp,u_grain,u_vig,u_seed,u_mirror,u_gsize,u_clar;
uniform vec3 u_wb;
uniform vec2 u_px;
uniform float u_nr;
uniform vec2 u_res;
uniform float u_look2,u_split,u_orig;
uniform vec4 u_tile;
uniform vec2 u_poff;
const float N=17.;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float luma(vec3 c){return dot(c,vec3(.2126,.7152,.0722));}
vec3 lut(vec3 c,float lk){
  c=clamp(c,0.,1.);
  float bz=c.b*(N-1.),b0=floor(bz),b1=min(b0+1.,N-1.),f=bz-b0;
  float x0=(b0*N+c.r*(N-1.)+.5)/(N*N),x1=(b1*N+c.r*(N-1.)+.5)/(N*N);
  float y=(lk*N+c.g*(N-1.)+.5)/(N*u_nlooks);
  return mix(texture2D(u_lut,vec2(x0,y)).rgb,texture2D(u_lut,vec2(x1,y)).rgb,f);
}
void main(){
  vec2 g=u_tile.xy+v_uv*u_tile.zw;   // 画像全体での位置（タイル分割描画用）
  vec2 uv=g; if(u_mirror>.5) uv.x=1.-uv.x;
  vec2 tuv=u_crop.xy+uv*u_crop.zw;
  vec3 c=texture2D(u_tex,tuv).rgb;
  if(u_orig>.5){gl_FragColor=vec4(c,1.);return;}
  // ノイズ低減：平らな所だけ周囲となじませる（輪郭は残す）
  if(u_nr>0.){
    vec3 s1=texture2D(u_tex,tuv+vec2(u_px.x,0.)).rgb,s2=texture2D(u_tex,tuv-vec2(u_px.x,0.)).rgb;
    vec3 s3=texture2D(u_tex,tuv+vec2(0.,u_px.y)).rgb,s4=texture2D(u_tex,tuv-vec2(0.,u_px.y)).rgb;
    vec3 s5=texture2D(u_tex,tuv+u_px).rgb,s6=texture2D(u_tex,tuv-u_px).rgb;
    vec3 s7=texture2D(u_tex,tuv+vec2(u_px.x,-u_px.y)).rgb,s8=texture2D(u_tex,tuv+vec2(-u_px.x,u_px.y)).rgb;
    vec3 nb=(s1+s2+s3+s4+s5+s6+s7+s8)*.125;
    float ed=max(max(length(s1-s2),length(s3-s4)),max(length(s5-s6),length(s7-s8)));
    float fl=1.-smoothstep(.04,.12,ed);
    c=mix(c,nb,u_nr*fl);
  }
  // 立体感（ローカルコントラスト）：周囲の平均との差を少し強調
  if(u_clar>0.){
    float ar0=u_res.x/u_res.y;
    vec2 d=vec2(.007/ar0,.007)*u_crop.zw;
    vec3 bl=vec3(0.);
    for(int i=0;i<12;i++){
      float a=float(i)*.5236; float rr=(i<6)?1.:.5;
      if(i>=6) a+=.2618;
      bl+=texture2D(u_tex,tuv+vec2(cos(a),sin(a))*d*rr*(i<6?1.:1.)).rgb;
    }
    bl/=12.;
    float dl=clamp(luma(c)-luma(bl),-.05,.05);   // 強い輪郭は強調しない（白フチ防止）
    c+=dl*u_clar*(1.-smoothstep(.75,1.,luma(c)))*smoothstep(0.,.12,luma(c));
  }
  // ホワイトバランス＋露出（リニア空間）
  vec3 l=pow(max(c,0.),vec3(2.2))*u_wb*exp2(u_exp);
  if(u_exp>0.){float k=.3*u_exp;l=l*(1.+k)/(1.+k*l);}
  c=pow(clamp(l,0.,1.),vec3(1./2.2));
  c=lut(c,(g.x<u_split)?u_look:u_look2);
  vec2 p=(g-.5)*2.; float ar=u_res.x/u_res.y; p.x*=ar;
  float r=length(p)/length(vec2(ar,1.));
  c*=1.-u_vig*pow(r,2.4);
  float n=hash(floor((gl_FragCoord.xy+u_poff)/u_gsize)+u_seed)-.5;
  float L2=luma(c); float w=1.-pow(abs(L2-.5)*2.,2.);
  c+=n*u_grain*(.35+.65*w);
  if(u_split<1.5&&abs(g.x-u_split)*u_res.x<1.5) c=vec3(1.);   // 比較の境目に白線
  gl_FragColor=vec4(clamp(c,0.,1.),1.);
}`;

// ===== State =====
const $=id=>document.getElementById(id);
const video=$("video"),view=$("view"),stage=$("stage"),msg=$("msg");
const S={auto:true,look:0,ev:0,aspect:0,res:0,film:true,grid:true,frame:false,facing:"environment",stream:null,track:null,shots:[],vi:0,busy:false};
try{Object.assign(S,JSON.parse(localStorage.getItem("utsushi")||"{}"),{stream:null,track:null,shots:[],vi:0,busy:false});}catch(e){}
if(!(S.look>=0&&S.look<9))S.look=0;
const persist=()=>{try{localStorage.setItem("utsushi",JSON.stringify({auto:S.auto,film:S.film,look:S.look,ev:S.ev,aspect:S.aspect,res:S.res,grid:S.grid,frame:S.frame,facing:S.facing}));}catch(e){}};

let R,EX;
try{R=new Renderer(view,false);EX=new Renderer(document.createElement("canvas"),true);}
catch(e){msg.textContent="この端末ではWebGLが使えません："+e.message;}

// 粒子と周辺減光（FILMボタンでON/OFF）
function film(a){
  if(!S.film)return{grain:0,vig:0};
  const base=LOOKS[S.look].mono?{grain:.045,vig:.28}:{grain:.03,vig:.22};
  // 暗い場面（大きく持ち上げた時）は元のノイズが多いので粒子を控えめに
  const g=Math.max(0,(a?a.exp:0)+S.ev), k=Math.max(.15,1-.6*g);
  return{grain:base.grain*k,vig:base.vig};
}
// ===== おまかせ補正（ホワイトバランス・明るさ） =====
const ana=document.createElement("canvas");ana.width=64;ana.height=48;
const anaCtx=ana.getContext("2d",{willReadFrequently:true});
const AUTO={wb:[1,1,1],exp:0,ready:false};
function analyze(src,sw,sh){
  const W=64,H=Math.max(8,Math.round(64*sh/sw));ana.height=H;
  anaCtx.drawImage(src,0,0,W,H);
  const d=anaCtx.getImageData(0,0,W,H).data;
  const lin=v=>Math.pow(v/255,2.2);
  let sr=0,sg=0,sb=0,n=0;const Ls=[];
  for(let i=0;i<d.length;i+=4){
    const r=lin(d[i]),g=lin(d[i+1]),b=lin(d[i+2]);
    const y=.2126*r+.7152*g+.0722*b;Ls.push(y);
    if(y>.01&&Math.max(r,g,b)<.92){sr+=r;sg+=g;sb+=b;n++;}
  }
  let wb=[1,1,1];
  if(n>20){
    const m=(sr+sg+sb)/3;
    // 灰色仮説で色かぶりを推定し、7割だけ補正（雰囲気は少し残す）。ライカ寄りにわずかに暖色を残す
    const tgt=[1.02,1,.97];
    wb=[m/sr*tgt[0],m/sg*tgt[1],m/sb*tgt[2]].map(v=>Math.pow(v,.7));
    const gn=wb[1];wb=wb.map(v=>Math.min(1.6,Math.max(.65,v/gn)));
  }
  Ls.sort((a,b)=>a-b);
  const p98=Ls[Math.floor(Ls.length*.98)]*1.0, p50=Ls[Math.floor(Ls.length*.5)];
  // 一番明るい所が白に近づくように（上げすぎ・下げすぎは制限）
  let e=Math.log2(.78/Math.max(p98,1e-3));
  e=Math.min(e,Math.log2(.30/Math.max(p50,1e-4)));  // 中間が明るくなりすぎない
  e=Math.max(-1,Math.min(1.6,e));
  return{wb,exp:e};
}
let anaT=0;
function updateAuto(){
  const now=performance.now();if(now-anaT<250)return;anaT=now;
  const a=analyze(video,video.videoWidth,video.videoHeight);
  const t=AUTO.ready?.25:1;
  AUTO.wb=AUTO.wb.map((v,i)=>v+(a.wb[i]-v)*t);AUTO.exp+=(a.exp-AUTO.exp)*t;AUTO.ready=true;
}
function autoParams(a){
  const up=Math.max(0,(S.auto?a.exp:0)+S.ev);          // どれだけ明るく持ち上げたか
  const clar=(S.auto?.3:.2)*Math.max(.25,1-.5*up);      // 暗い場面ほど立体感は控えめ
  const nr=Math.min(.9,.35+.45*up);                      // 暗い場面ほどノイズ低減を強く
  return S.auto?{wb:a.wb,exp:a.exp+S.ev,clar,nr}:{wb:[1,1,1],exp:S.ev,clar,nr};
}
// LUT画像を読み込み
const lutImg=new Image();
lutImg.onload=()=>{if(R)R.setLut(lutImg);if(EX)EX.setLut(lutImg);if(ED){ED.setLut(lutImg);edRender();}};
lutImg.src=LUT_SRC;

function cropFor(sw,sh){
  let A=ASPECTS[S.aspect].v; if(!A) return[0,0,1,1]; if(sh>sw) A=1/A;
  const sa=sw/sh;
  if(sa>A){const w=A/sa;return[(1-w)/2,0,w,1];}
  const h=sa/A;return[0,(1-h)/2,1,h];
}
function targetAspect(sw,sh){let A=ASPECTS[S.aspect].v;if(!A)return sw/sh;return sh>sw?1/A:A;}

function layout(){
  const vw=video.videoWidth||1280,vh=video.videoHeight||720;
  const A=targetAspect(vw,vh);
  const r=stage.getBoundingClientRect();
  let w,h; if(r.width/r.height>A){h=r.height;w=h*A;}else{w=r.width;h=w/A;}
  const dpr=Math.min(window.devicePixelRatio||1,2);
  view.style.width=w+"px";view.style.height=h+"px";
  view.width=Math.round(w*dpr);view.height=Math.round(h*dpr);
  const g=$("grid");g.style.width=w+"px";g.style.height=h+"px";
  g.style.left=(r.width-w)/2+"px";g.style.top=(r.height-h)/2+"px";
}

let fr=0;
function loop(){
  requestAnimationFrame(loop);
  if(!R||video.readyState<2||!video.videoWidth) return;
  R.upload(video);
  if(!R.lutReady) return;
  if(S.auto) updateAuto();
  const A=autoParams(AUTO),F=film(S.auto?AUTO:null);
  R.draw({crop:cropFor(video.videoWidth,video.videoHeight),look:S.look,exp:A.exp,wb:A.wb,clar:A.clar,nr:A.nr,px:[1/video.videoWidth,1/video.videoHeight],grain:F.grain,vig:F.vig,seed:(fr++%60)*1.37,mirror:S.facing==="user",gsize:1});
}

// ===== Camera =====
async function startCamera(){
  stopCamera();
  msg.style.display="flex";msg.textContent="カメラを起動中…";
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    msg.innerHTML="カメラが使えません。<br>HTTPS（GitHub Pagesなど）で開いてね。";return;
  }
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:S.facing},width:{ideal:3840},height:{ideal:2160}}});
    S.stream=st;S.track=st.getVideoTracks()[0];
    video.srcObject=st;await video.play();
    msg.style.display="none";
    setupZoom();
    setTimeout(layout,50);
  }catch(e){
    msg.innerHTML=`カメラを開けませんでした（${e.name||e.message}）<br>ブラウザの設定でカメラを許可してね。<br><button id="retry">もう一度</button>`;
    $("retry").onclick=startCamera;
  }
}
function stopCamera(){if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null;S.track=null;}}

function setupZoom(){
  const z=$("zoom");z.innerHTML="";
  const caps=S.track&&S.track.getCapabilities?S.track.getCapabilities():{};
  if(!caps.zoom) return;
  const lv=[1,2,3,5].filter(v=>v>=caps.zoom.min&&v<=caps.zoom.max);
  if(lv.length<2) return;
  lv.forEach(v=>{
    const b=document.createElement("button");b.textContent=v+"×";if(v===1)b.classList.add("on");
    b.onclick=async()=>{try{await S.track.applyConstraints({advanced:[{zoom:v}]});[...z.children].forEach(c=>c.classList.toggle("on",c===b));}catch(e){}};
    z.appendChild(b);
  });
}

// ===== Process / capture =====
function timeout(p,ms){return Promise.race([p,new Promise((_,rj)=>setTimeout(()=>rj(new Error("timeout")),ms))]);}

async function processImage(src,sw,sh,mirror,auto,mpMax){
  // ImageBitmapはWebGLの上下反転指定が効かないので、必ずcanvasに描き直す
  // テクスチャ上限を超える場合は縮小
  let s=src;
  const lim=Math.min(EX.maxTex,8192);
  const isBmp=typeof ImageBitmap!=="undefined"&&src instanceof ImageBitmap;
  // 解像度設定（切り抜き後の画素数で判定）
  const c0=cropFor(sw,sh);let mp=(RES[S.res]||RES[0]).mp;if(mpMax&&(!mp||mp>mpMax))mp=mpMax;
  const area=sw*c0[2]*sh*c0[3];
  const km=mp&&area>mp*1e6?Math.sqrt(mp*1e6/area):1;
  if(isBmp||km<1||Math.max(sw,sh)>lim){
    const k=Math.min(1,lim/Math.max(sw,sh),km);const c=document.createElement("canvas");
    c.width=Math.round(sw*k);c.height=Math.round(sh*k);c.getContext("2d").drawImage(src,0,0,c.width,c.height);
    s=c;sw=c.width;sh=c.height;
  }
  const crop=cropFor(sw,sh);
  const OW=Math.round(sw*crop[2]),OH=Math.round(sh*crop[3]);
  // 大きな画像は4096px角のタイルに分けて描画（端末の描画上限で切れたり縮んだりしないように）
  let T=4096;
  EX.c.width=Math.min(T,OW);EX.c.height=Math.min(T,OH);
  const dbw=EX.gl.drawingBufferWidth,dbh=EX.gl.drawingBufferHeight;
  const TW=Math.min(EX.c.width,dbw),TH=Math.min(EX.c.height,dbh);
  EX.c.width=TW;EX.c.height=TH;
  EX.upload(s);
  const a=auto||analyze(s,sw,sh);
  const L=LOOKS[S.look],A=autoParams(a),F=film(S.auto?a:null);
  const nrk=Math.max(1,Math.max(sw,sh)/1600),seed=Math.random()*100,gsize=Math.max(1,Math.max(OW,OH)/1800);
  const full=document.createElement("canvas");full.width=OW;full.height=OH;
  const fx=full.getContext("2d");
  if(!fx||full.width!==OW) throw new Error("canvas too large");
  for(let y=0;y<OH;y+=TH){
    for(let x=0;x<OW;x+=TW){
      const w=Math.min(TW,OW-x),h=Math.min(TH,OH-y);
      EX.draw({crop,look:S.look,exp:A.exp,wb:A.wb,clar:A.clar,nr:A.nr,px:[nrk/sw,nrk/sh],grain:F.grain,vig:F.vig,seed,mirror,gsize,
        vp:[w,h],res:[OW,OH],tile:[x/OW,1-(y+h)/OH,w/OW,h/OH],poff:[x,OH-(y+h)]});
      fx.drawImage(EX.c,0,TH-h,w,h,x,y,w,h);
    }
  }
  let out=full;
  if(S.frame) out=addFrame(full,L.name);
  const blob=await new Promise(res=>out.toBlob(res,"image/jpeg",0.93));
  blob.w=out.width;blob.h=out.height;
  return blob;
}

function addFrame(src,lookName){
  const W=src.width,H=src.height,s=Math.min(W,H);
  const side=Math.round(s*.035),bottom=Math.round(s*.11);
  const c=document.createElement("canvas");c.width=W+side*2;c.height=H+side+bottom;
  const x=c.getContext("2d");
  x.fillStyle="#f7f6f2";x.fillRect(0,0,c.width,c.height);
  x.drawImage(src,side,side);
  const y=side+H+bottom/2,fs=Math.round(bottom*.2);
  x.textBaseline="middle";
  x.fillStyle="#ff7a1a";x.beginPath();x.arc(side+fs*.4,y,fs*.3,0,Math.PI*2);x.fill();
  x.fillStyle="#1a1a1a";x.textAlign="left";x.font=`600 ${fs}px -apple-system,"Helvetica Neue",Arial,sans-serif`;
  x.fillText("UTSUSHI",side+fs*1.1,y);
  const d=new Date(),pad=n=>String(n).padStart(2,"0");
  x.fillStyle="#7a7a7a";x.textAlign="right";x.font=`400 ${Math.round(fs*.82)}px -apple-system,"Helvetica Neue",Arial,sans-serif`;
  x.fillText(`${lookName}   ${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`,side+W,y);
  return c;
}

async function capture(){
  if(S.busy||!S.track||!EX) return;
  S.busy=true;$("shutter").classList.add("busy");
  const f=$("flash");f.style.opacity=.85;setTimeout(()=>f.style.opacity=0,120);
  if(navigator.vibrate) navigator.vibrate(15);
  try{
    let src=video,sw=video.videoWidth,sh=video.videoHeight;
    // 背面カメラは高解像度の静止画を試す（Android Chromeなど）
    if(S.facing==="environment"&&"ImageCapture" in window){
      try{
        const ic=new ImageCapture(S.track);
        // 最大解像度で撮影を試す（非対応なら通常撮影）
        let opt;
        try{const pc=await timeout(ic.getPhotoCapabilities(),1500);if(pc&&pc.imageWidth&&pc.imageHeight)opt={imageWidth:pc.imageWidth.max,imageHeight:pc.imageHeight.max};}catch(e){}
        let blob;
        try{blob=await timeout(ic.takePhoto(opt),4000);}catch(e){if(!opt)throw e;blob=await timeout(ic.takePhoto(),3500);}
        let bmp;try{bmp=await createImageBitmap(blob,{imageOrientation:"from-image"});}catch(e){bmp=await createImageBitmap(blob);}
        if((bmp.width>bmp.height)===(sw>sh)&&bmp.width*bmp.height>sw*sh){src=bmp;sw=bmp.width;sh=bmp.height;}
      }catch(e){}
    }
    const out=await processImage(src,sw,sh,S.facing==="user",AUTO.ready?{wb:AUTO.wb.slice(),exp:AUTO.exp}:null);
    addShot(out);
    toast("撮影しました");
  }catch(e){toast("撮影に失敗："+e.message);}
  S.busy=false;$("shutter").classList.remove("busy");
}

function fname(){const d=new Date(),p=n=>String(n).padStart(2,"0");return `UTSUSHI_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}_${Math.floor(Math.random()*90+10)}.jpg`;}
function addShot(blob){
  const url=URL.createObjectURL(blob);
  S.shots.push({blob,url,name:fname(),look:LOOKS[S.look].name,w:blob.w,h:blob.h});
  $("thumb").style.backgroundImage=`url(${url})`;
}

// ===== Viewer =====
function openViewer(i){if(!S.shots.length)return;S.vi=i;showShot();$("viewer").classList.add("on");}
function showShot(){const s=S.shots[S.vi];$("vimg").src=s.url;$("vinfo").textContent=`${S.vi+1} / ${S.shots.length}　${s.look}　${s.w}×${s.h}（${(s.w*s.h/1e6).toFixed(1)}MP）`;}
$("vprev").onclick=()=>{if(S.vi>0){S.vi--;showShot();}};
$("vnext").onclick=()=>{if(S.vi<S.shots.length-1){S.vi++;showShot();}};
$("vclose").onclick=()=>$("viewer").classList.remove("on");
$("vshare").onclick=async()=>{

  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});}catch(e){}
  }else download(s);
};
$("vdl").onclick=()=>download(S.shots[S.vi]);
async function saveShot(s){
  const file=new File([s.blob],s.name,{type:"image/jpeg"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return;}catch(e){if(e&&e.name==="AbortError")return;}}
  download(s);
}
function download(s){const a=document.createElement("a");a.href=s.url;a.download=s.name;document.body.appendChild(a);a.click();a.remove();toast("ダウンロードしました");}

// ===== Import =====
$("importBtn").onclick=()=>$("file").click();
$("file").onchange=e=>{

// ===== 編集画面（読み込んだ写真に色味をつける） =====
const E={queue:[],bmp:null,prev:null,auto:null,drag:null,hold:null,orig:false,saved:0};
let ED=null;
function edRenderer(){
  if(ED)return ED;
  ED=new Renderer($("ecv"),false);if(lutImg.complete&&lutImg.naturalWidth)ED.setLut(lutImg);return ED;
}
async function nextEdit(){
  const f=E.queue.shift();
  if(!f){closeEditor();return;}
  $("editor").classList.add("on");stopCamera();
  $("einfo").textContent="読み込み中…";
  try{
    let bmp;try{bmp=await createImageBitmap(f,{imageOrientation:"from-image"});}catch(er){bmp=await createImageBitmap(f);}
    if(E.bmp&&E.bmp.close)E.bmp.close();
    E.bmp=bmp;
    // 画面用の縮小版（長辺2048px）
    const k=Math.min(1,2048/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    E.prev=c;E.auto=analyze(c,c.width,c.height);
    const r=edRenderer();r.upload(c);
    $("einfo").textContent=`${bmp.width}×${bmp.height}（${(bmp.width*bmp.height/1e6).toFixed(0)}MP）`+(E.queue.length?`　残り${E.queue.length}枚`:"");
    edLayout();edRender();edRenderUI();flashName(LOOKS[S.look].name);
  }catch(er){toast("読込に失敗："+er.message);nextEdit();}
}
function closeEditor(){
  $("editor").classList.remove("on");
  if(E.bmp&&E.bmp.close)E.bmp.close();E.bmp=null;E.prev=null;
  startCamera();
  if(E.saved){openViewer(S.shots.length-1);E.saved=0;}
}
function edLayout(){
  if(!E.prev)return;
  const w0=E.prev.width,h0=E.prev.height,cr=cropFor(w0,h0);
  const A=(w0*cr[2])/(h0*cr[3]);
  const r=$("ewrap").getBoundingClientRect();
  let w,h;if(r.width/r.height>A){h=r.height-8;w=h*A;}else{w=r.width-8;h=w/A;}
  const dpr=Math.min(window.devicePixelRatio||1,2),cv=$("ecv");
  cv.style.width=w+"px";cv.style.height=h+"px";cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
}
function edRender(){
  if(!ED||!E.prev||!ED.lutReady)return;
  const w0=E.prev.width,h0=E.prev.height,a=E.auto;
  const A=autoParams(a),F=film(S.auto?a:null);
  const nrk=Math.max(1,Math.max(w0,h0)/1600);
  const o={crop:cropFor(w0,h0),look:S.look,exp:A.exp,wb:A.wb,clar:A.clar,nr:A.nr,px:[nrk/w0,nrk/h0],
    grain:F.grain,vig:F.vig,seed:7.3,mirror:false,gsize:Math.max(1,Math.max(ED.c.width,ED.c.height)/1800),orig:E.orig};
  const d=E.drag;
  if(d&&d.dx){
    const n=LOOKS.length,W=ED.c.clientWidth||1;
    if(d.dx<0){o.look2=(S.look+1)%n;o.split=1+d.dx/W;}           // 右から次の色味
    else{o.look=(S.look-1+n)%n;o.look2=S.look;o.split=d.dx/W;}    // 左から前の色味
  }
  ED.draw(o);
}
function flashName(t){const e=$("ename");e.textContent=t;e.style.opacity=1;clearTimeout(flashName.t);flashName.t=setTimeout(()=>e.style.opacity=0,900);}
function edRenderUI(){
  const box=$("elooks");box.innerHTML="";
  LOOKS.forEach((l,i)=>{const b=document.createElement("button");b.className="chip"+(i===S.look?" on":"");b.textContent=l.name;
    b.onclick=()=>{setEdLook(i);};box.appendChild(b);});
  const on=box.children[S.look];if(on&&on.scrollIntoView)on.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
  $("etip").textContent=LOOKS[S.look].tip;
  $("eev").value=S.ev;$("eevv").textContent=(S.ev>0?"+":S.ev<0?"":"±")+Number(S.ev).toFixed(1);
  $("eauto").classList.toggle("on",S.auto);$("efilm").classList.toggle("on",S.film);$("eframe").classList.toggle("on",S.frame);
  $("easp").textContent=ASPECTS[S.aspect].label;
}
function setEdLook(i){S.look=i;persist();renderLooks();renderToggles();edRenderUI();edRender();flashName(LOOKS[i].name);}
// スワイプ・長押し
(function(){
  const el=$("ewrap");
  el.addEventListener("pointerdown",e=>{
    if(!E.prev)return;el.setPointerCapture(e.pointerId);
    E.drag={x0:e.clientX,y0:e.clientY,dx:0,moved:false};
    clearTimeout(E.hold);E.hold=setTimeout(()=>{if(E.drag&&!E.drag.moved){E.orig=true;edRender();flashName("ORIGINAL");}},350);
  });
  el.addEventListener("pointermove",e=>{
    const d=E.drag;if(!d)return;
    const dx=e.clientX-d.x0;
    if(Math.abs(dx)>8)d.moved=true;
    if(E.orig)return;
    if(d.moved){d.dx=Math.max(-ED.c.clientWidth,Math.min(ED.c.clientWidth,dx));edRender();}
  });
  const end=e=>{
    const d=E.drag;clearTimeout(E.hold);E.drag=null;
    if(E.orig){E.orig=false;edRender();return;}
    if(!d)return;
    const W=ED.c.clientWidth||1,n=LOOKS.length;
    if(Math.abs(d.dx)>W*.25) setEdLook(d.dx<0?(S.look+1)%n:(S.look-1+n)%n);
    else edRender();
  };
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
})();
$("ecancel").onclick=()=>{E.queue=[];closeEditor();};
$("eev").oninput=e=>{S.ev=parseFloat(e.target.value);persist();renderToggles();edRenderUI();edRender();};
$("eauto").onclick=()=>{S.auto=!S.auto;persist();renderToggles();edRenderUI();edRender();};
$("efilm").onclick=()=>{S.film=!S.film;persist();renderToggles();edRenderUI();edRender();};
$("eframe").onclick=()=>{S.frame=!S.frame;persist();renderToggles();edRenderUI();toast(S.frame?"白フチ：保存時に付きます":"白フチ：OFF");};
$("easp").onclick=()=>{S.aspect=(S.aspect+1)%ASPECTS.length;persist();renderToggles();edRenderUI();edLayout();edRender();};
$("esave").onclick=async()=>{
  if(!E.bmp)return;
  $("ebusy").style.display="flex";await new Promise(r=>setTimeout(r,30));
  const b=E.bmp,a=E.auto;
  let blob=null;
  try{blob=await processImage(b,b.width,b.height,false,a);}
  catch(er){
    // メモリ不足など → 解像度を下げて再挑戦
    try{blob=await processImage(b,b.width,b.height,false,a,24);toast("容量が大きすぎたため24MPで保存しました");}
    catch(er2){try{blob=await processImage(b,b.width,b.height,false,a,12);toast("容量が大きすぎたため12MPで保存しました");}catch(er3){toast("保存に失敗："+er3.message);}}
  }
  $("ebusy").style.display="none";
  if(blob){addShot(blob);E.saved++;
    // 自動で端末に保存（共有シート or ダウンロード）
    download(S.shots[S.shots.length-1]);
    nextEdit();
  }
};
window.addEventListener("resize",()=>{if($("editor").classList.contains("on"))setTimeout(()=>{edLayout();edRender();},120);});

// ===== UI =====
function toast(t){const e=$("toast");e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1600);}
function renderLooks(){
  const box=$("looks");box.innerHTML="";
  LOOKS.forEach((l,i)=>{const b=document.createElement("button");b.className="chip"+(i===S.look?" on":"");b.textContent=l.name;
    b.onclick=()=>{S.look=i;persist();renderLooks();};box.appendChild(b);});
}
function renderToggles(){
  $("aspectBtn").textContent=ASPECTS[S.aspect].label;
  $("resBtn").textContent=(RES[S.res]||RES[0]).label;
  $("gridBtn").classList.toggle("on",S.grid);$("grid").classList.toggle("on",S.grid);
  $("frameBtn").classList.toggle("on",S.frame);
  $("autoBtn").classList.toggle("on",S.auto);
  $("tip").textContent=LOOKS[S.look].tip;
  $("level").style.display=S.grid&&levelOn?"block":"none";
  $("filmBtn").classList.toggle("on",S.film);
  $("ev").value=S.ev;$("evv").textContent=(S.ev>0?"+":S.ev<0?"":"±")+Number(S.ev).toFixed(1);
}
$("aspectBtn").onclick=()=>{S.aspect=(S.aspect+1)%ASPECTS.length;persist();renderToggles();layout();};
$("resBtn").onclick=()=>{S.res=(S.res+1)%RES.length;persist();renderToggles();toast("解像度："+RES[S.res].label);};
$("gridBtn").onclick=async()=>{S.grid=!S.grid;persist();if(S.grid)await startLevel();renderToggles();};
$("autoBtn").onclick=()=>{S.auto=!S.auto;persist();renderToggles();toast(S.auto?"おまかせ補正：ON（色かぶり・明るさを自動で整えます）":"おまかせ補正：OFF");};
$("filmBtn").onclick=()=>{S.film=!S.film;persist();renderToggles();toast(S.film?"粒子・周辺減光：ON":"粒子・周辺減光：OFF");};
$("frameBtn").onclick=()=>{S.frame=!S.frame;persist();renderToggles();toast(S.frame?"白フチ：ON":"白フチ：OFF");};
$("ev").oninput=e=>{S.ev=parseFloat(e.target.value);persist();renderToggles();};
$("ev").ondblclick=()=>{S.ev=0;persist();renderToggles();};
$("shutter").onclick=capture;
$("thumb").onclick=()=>openViewer(S.shots.length-1);
$("flip").onclick=()=>{S.facing=S.facing==="environment"?"user":"environment";persist();startCamera();};
document.addEventListener("keydown",e=>{if((e.key===" "||e.key==="AudioVolumeUp"||e.key==="AudioVolumeDown")&&!$("viewer").classList.contains("on")){e.preventDefault();capture();}});
window.addEventListener("resize",()=>setTimeout(layout,100));
video.addEventListener("loadedmetadata",layout);
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopCamera();else if(!$("editor").classList.contains("on"))startCamera();});

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
// ===== 水平器（グリッドON時に表示。水平になるとオレンジ） =====
let levelOn=false,levelStarted=false;
async function startLevel(){
  if(levelStarted)return;levelStarted=true;
  try{if(typeof DeviceMotionEvent!=="undefined"&&DeviceMotionEvent.requestPermission){const r=await DeviceMotionEvent.requestPermission();if(r!=="granted")return;}}catch(e){return;}
  window.addEventListener("devicemotion",e=>{
    const g=e.accelerationIncludingGravity;if(!g||g.x==null)return;
    if(Math.abs(g.z)>8.5){levelOn=false;$("level").style.display="none";return;} // 上や下に向けている時は非表示
    const ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
    let a=Math.atan2(g.x,g.y)*180/Math.PI;           // 縦持ち基準
    a=((a+ang+540)%360)-180;                          // 画面の向きを補正
    let t=a; if(t>90)t-=180; if(t<-90)t+=180;         // 上下どちら向きでも水平基準
    levelOn=true;const el=$("level");el.style.display=S.grid?"block":"none";
    el.style.transform=`translate(-50%,-50%) rotate(${-t}deg)`;el.classList.toggle("ok",Math.abs(t)<1.2);
  });
}
if(S.grid)startLevel();
renderLooks();renderToggles();
if(R){startCamera();requestAnimationFrame(loop);}
</script>
