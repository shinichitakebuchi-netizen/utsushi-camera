<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>写 UTSUSHI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="写">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--acc:#ff7a1a;--blue:#4a7fd4;--fg:#f2f0eb;--dim:#8a8780;--mute:#5a5853;--line:#2a2a2a;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono","Noto Sans Mono",monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0b0b;color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:radial-gradient(rgba(255,255,255,.035) .8px,transparent 1.1px) 0 0/4px 4px,#0b0b0b}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 9px;gap:8px;border-bottom:1px solid #181818}
.brand{white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand b{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1}
.brand i{width:7px;height:7px;border-radius:50%;background:var(--acc);display:inline-block;box-shadow:0 0 6px rgba(255,122,26,.7)}
.brand span{font-size:10.5px;font-weight:600;letter-spacing:.42em}
.brand small{font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:.04em}
.hbtns{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(#1b1b1b,#121212);border:1px solid #272727;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.6);color:var(--dim);border-radius:7px;padding:6px 9px;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;transition:color .2s}
.pill:active{transform:translateY(1px)}
.pill.tg::before{content:"";width:5px;height:5px;border-radius:50%;background:#383838;transition:background .2s,box-shadow .2s}
.pill.tg.on{color:var(--fg)}
.pill.tg.on::before{background:var(--acc);box-shadow:0 0 6px var(--acc)}
.pill.cyc{color:var(--fg)}
.pill.cyc::after{content:"";border-left:3px solid transparent;border-right:3px solid transparent;border-top:4px solid var(--mute)}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;background:#000}
#view{display:block;background:#0c0c0c}
#grid{position:absolute;pointer-events:none;display:none}
#grid.on{display:block}
#grid::before{content:"";position:absolute;left:33.333%;width:33.333%;top:0;height:100%;border-left:1px solid rgba(255,255,255,.22);border-right:1px solid rgba(255,255,255,.22)}
#grid::after{content:"";position:absolute;top:33.333%;height:33.333%;left:0;width:100%;border-top:1px solid rgba(255,255,255,.22);border-bottom:1px solid rgba(255,255,255,.22)}
/* ファインダー枠（四隅のカギ）と情報表示 */
#vf{position:absolute;pointer-events:none;--c:rgba(255,255,255,.75);background-repeat:no-repeat;
  background-image:linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),
    linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c)),linear-gradient(var(--c),var(--c));
  background-position:left 9px top 9px,left 9px top 9px,right 9px top 9px,right 9px top 9px,left 9px bottom 9px,left 9px bottom 9px,right 9px bottom 9px,right 9px bottom 9px;
  background-size:16px 1.5px,1.5px 16px,16px 1.5px,1.5px 16px,16px 1.5px,1.5px 16px,16px 1.5px,1.5px 16px}
#vfbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:baseline;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  color:var(--acc);text-shadow:0 0 6px rgba(255,122,26,.55),0 1px 2px #000;white-space:nowrap}
#vfbar b{font-weight:600;color:#fff;text-shadow:0 1px 3px #000}
/* 測光メーター（被写体が見えるよう小さく・薄く） */
.meter{position:absolute;top:34px;left:12px;width:146px;padding:6px 8px 7px;border-radius:8px;background:rgba(8,8,8,.42);
  border:1px solid rgba(255,255,255,.08);font-size:8.5px;color:var(--dim);text-shadow:0 1px 2px rgba(0,0,0,.6);
  display:none;pointer-events:none;z-index:3}
.meter.on{display:block}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.mh span{font-family:var(--serif);font-size:9.5px;color:var(--fg);letter-spacing:.2em}
.mh em{font-style:normal;font-family:var(--mono);font-size:8px;color:var(--acc);border:1px solid rgba(255,122,26,.5);border-radius:3px;padding:0 4px;letter-spacing:.02em}
.mh em.off{color:var(--dim);border-color:#3a3a3a}
.hist{display:block;width:100%;height:26px;border-bottom:1px solid rgba(255,255,255,.2)}
.mv{display:flex;margin-top:4px}
.mv div{display:flex;align-items:baseline;justify-content:center;gap:2px;flex:1}
.mv b{font-family:var(--mono);font-size:11px;color:var(--fg);font-weight:500}
.mv small{order:-1;font-size:7.5px;color:var(--dim);letter-spacing:.04em}
.mc{display:flex;justify-content:space-between;margin-top:3px;font-size:8px}
.mc b{font-family:var(--mono);font-weight:500;color:var(--fg);margin-left:2px}
.mc b.hot{color:var(--acc)}.mc b.cold{color:var(--blue)}
.mr{display:flex;align-items:center;gap:5px;margin-top:4px;padding-top:4px;border-top:1px solid rgba(255,255,255,.08);font-family:var(--mono);font-size:8.5px;color:var(--fg);white-space:nowrap}
.mr small{width:14px;flex:none;font-size:7.5px;color:var(--dim)}
.mr .d{color:var(--dim)}
.wbbar{position:relative;width:34px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--blue),#4a4a4a,var(--acc));flex:none}
.wbbar i{position:absolute;top:50%;left:50%;width:6px;height:6px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 1.5px rgba(0,0,0,.6);transition:left .3s}
#flash{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .18s}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:13px;line-height:1.8;color:var(--dim)}
#msg button{margin-top:14px;background:var(--acc);color:#000;border:none;border-radius:20px;padding:10px 22px;font-weight:600}
#zoom{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:3px;border-radius:24px;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#zoom:empty{display:none}
#zoom button{width:36px;height:36px;border-radius:50%;background:none;border:none;color:var(--fg);font-family:var(--mono);font-size:11px}
#zoom button.on{color:#000;background:var(--fg)}
/* 色味の選択（ダイヤル風） */
.looks{display:flex;gap:2px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none;
  background:linear-gradient(#262626,#262626) 0 100%/100% 1px no-repeat;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent)}
.looks::-webkit-scrollbar{display:none}
.looks::before,.looks::after{content:"";flex:0 0 40%}
.chip{flex:none;position:relative;padding:11px 11px 10px;border:none;background:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--mute);transition:color .2s}
.chip::after{content:"";position:absolute;left:50%;bottom:0;width:1px;height:5px;background:#3c3c3c}
.chip.on{color:var(--fg)}
.chip.on::before{content:"";position:absolute;left:50%;top:1px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--acc);box-shadow:0 0 6px var(--acc)}
.chip.on::after{background:var(--acc);height:9px;width:2px;margin-left:-.5px}
#tip{padding:7px 18px 2px;font-family:var(--serif);font-size:12px;color:var(--dim);letter-spacing:.06em;text-align:center;min-height:24px}
#level{position:absolute;left:50%;top:50%;width:120px;height:0;border-top:2px solid rgba(255,255,255,.7);transform:translate(-50%,-50%);pointer-events:none;display:none;transition:border-color .2s}
#level.ok{border-top-color:var(--acc)}
/* EVダイヤル（目盛りを左右にスクロール） */
.row{display:flex;align-items:center;gap:10px;padding:2px 18px;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.14em}
.row span.v{width:44px;text-align:right;color:var(--fg);font-size:13px;letter-spacing:.02em}
.rwrap{position:relative;flex:1;height:42px;min-width:0}
.ruler{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;scroll-snap-type:x mandatory;white-space:nowrap;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.ruler::-webkit-scrollbar{display:none}
.rtrack{display:inline-flex;height:100%}
.tk{flex:none;width:10px;height:100%;position:relative;scroll-snap-align:center}
.tk::before{content:"";position:absolute;left:50%;bottom:8px;width:1px;height:7px;background:#454545}
.tk.mj::before{height:13px;background:#86837c}
.tk.z::before{background:var(--fg);height:15px}
.tk[data-l]::after{content:attr(data-l);position:absolute;left:50%;top:3px;transform:translateX(-50%);font-family:var(--mono);font-size:8.5px;color:var(--mute);letter-spacing:0}
.needle{position:absolute;left:50%;bottom:5px;width:2px;height:21px;margin-left:-1px;background:var(--acc);border-radius:1px;box-shadow:0 0 6px rgba(255,122,26,.6);pointer-events:none}
.controls{display:flex;align-items:center;justify-content:space-between;padding:10px 34px 18px}
#thumb{width:54px;height:54px;border-radius:12px;background:#161616 center/cover no-repeat;border:1px solid #2c2c2c;box-shadow:0 0 0 3px #0b0b0b,0 0 0 4px #222}
#shutter{width:80px;height:80px;border-radius:50%;border:none;position:relative;background:repeating-conic-gradient(#e8e6e0 0 3deg,#8f8c85 3deg 6deg);box-shadow:0 2px 12px rgba(0,0,0,.8)}
#shutter::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#0b0b0b}
#shutter::after{content:"";position:absolute;inset:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e6e3dc 55%,#c4c0b6);transition:transform .1s}
#shutter:active::after{transform:scale(.9)}
#shutter.busy::after{background:var(--acc)}
.round{width:54px;height:54px;border-radius:50%;background:linear-gradient(#1d1d1d,#111);border:1px solid #2a2a2a;color:var(--fg);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.round svg{width:22px;height:22px}
#editor{position:fixed;inset:0;background:#0b0b0b;display:none;flex-direction:column;z-index:12;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#editor.on{display:flex}
.ebar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
.ebar button{background:linear-gradient(#1b1b1b,#121212);color:var(--fg);border:1px solid #272727;border-radius:8px;padding:8px 16px;font-size:12px;letter-spacing:.06em}
.ebar button.pri{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}
#einfo{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.04em}
.ewrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;touch-action:none;background:#000}
#ecv{display:block}
#ename{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:20px;letter-spacing:.3em;font-weight:600;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6);opacity:0;transition:opacity .35s;pointer-events:none;white-space:nowrap}
#ebusy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);font-size:13px;letter-spacing:.1em;z-index:4}
.ehint{text-align:center;font-size:10px;color:var(--mute);padding:6px 0 0;letter-spacing:.04em}
#etip{padding:4px 18px 2px;font-family:var(--serif);font-size:12px;color:var(--dim);min-height:22px;text-align:center}
.eopts{display:flex;gap:5px;justify-content:center;padding:6px 0 14px;flex-wrap:wrap}
#thumb,#flip,#shutter{transition:transform .3s}
body[data-rot="90"] #thumb,body[data-rot="90"] #flip{transform:rotate(90deg)}
body[data-rot="-90"] #thumb,body[data-rot="-90"] #flip{transform:rotate(-90deg)}
#spacer,#shade{display:none}
/* 縦画面：ファインダーを全面にして、操作部は上に重ねる */
@media not all and (orientation:landscape) and (min-aspect-ratio:5/4){
  #stage{position:absolute;inset:0;z-index:0;display:block}
  #view{position:absolute}
  #app>*:not(#stage){position:relative;z-index:1}
  #app>#shade{display:block;position:absolute;left:0;right:0;bottom:0;z-index:0;pointer-events:none;
    background:linear-gradient(rgba(11,11,11,0),rgba(11,11,11,.72) 36px,rgba(11,11,11,.9))}
  #spacer{display:block;flex:1;min-height:0;pointer-events:none}
  header{border-bottom:none;flex-wrap:nowrap;background:linear-gradient(rgba(11,11,11,.9),rgba(11,11,11,.55));padding:8px 0 8px 14px}
  .brand span{display:none}
  .hbtns{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;min-width:0;scrollbar-width:none;padding-right:14px;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 18px),transparent)}
  .hbtns::-webkit-scrollbar{display:none}
  .pill{flex:none}
  .looks{-webkit-mask-image:none;mask-image:none}
}
@media (orientation:landscape) and (min-aspect-ratio:5/4){
  #app{display:grid;grid-template-columns:1fr minmax(260px,32%);grid-template-rows:auto auto auto auto auto 1fr;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{grid-column:2;grid-row:1;flex-direction:column;align-items:stretch;padding:8px 10px 6px}
  .hbtns{justify-content:flex-start}
  #stage{grid-column:1;grid-row:1/7}
  .looks{grid-column:2;grid-row:2;padding:8px 0 2px}
  #tip{grid-column:2;grid-row:3;padding:4px 12px 2px}
  .row{grid-column:2;grid-row:4;padding:2px 12px}
  .controls{grid-column:2;grid-row:5;padding:8px 18px}
  #editor{display:none;grid-template-columns:1fr minmax(260px,32%);grid-template-rows:auto auto auto auto auto auto 1fr}
  #editor.on{display:grid}
  #editor .ebar{grid-column:2;grid-row:1}
  #editor .ewrap{grid-column:1;grid-row:1/8}
  #editor .ehint{grid-column:2;grid-row:2}
  #elooks{grid-column:2;grid-row:3}
  #etip{grid-column:2;grid-row:4}
  #editor .row{grid-column:2;grid-row:5}
  #editor .eopts{grid-column:2;grid-row:6}
}
#viewer{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:10;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#viewer.on{display:flex}
#viewer .imgwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:10px}
#viewer img{max-width:100%;max-height:100%;object-fit:contain}
#viewer .bar{display:flex;gap:8px;justify-content:center;padding:12px;flex-wrap:wrap}
#viewer .bar button{background:linear-gradient(#1b1b1b,#121212);color:var(--fg);border:1px solid #272727;border-radius:10px;padding:10px 16px;font-size:12px}
#viewer .bar button.pri{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}
#vinfo{text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.08em}
#toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:rgba(28,28,28,.92);border:1px solid #2c2c2c;color:var(--fg);padding:8px 16px;border-radius:10px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b>写</b><i></i><span>UTSUSHI</span><small>v13</small></div>
    <div class="hbtns">
      <button class="pill tg" id="autoBtn">AUTO</button>
      <button class="pill tg" id="meterBtn">METER</button>
      <button class="pill cyc" id="aspectBtn">3:2</button>
      <button class="pill cyc" id="resBtn">MAX</button>
      <button class="pill tg" id="gridBtn">GRID</button>
      <button class="pill tg" id="filmBtn">FILM</button>
      <button class="pill tg" id="frameBtn">FRAME</button>
      <button class="pill" id="importBtn">読込</button>
    </div>
  </header>
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="grid"></div>
    <div id="vf"><div id="vfbar"></div><div class="meter" id="meter"></div></div>
    <div id="level"></div>
    <div id="flash"></div>
    <div id="zoom"></div>
    <div id="msg">カメラを起動中…</div>
  </div>
  <div id="spacer"></div>
  <div id="shade"></div>
  <div class="looks" id="looks"></div>
  <div id="tip"></div>
  <div class="row">EV <div class="rwrap"><div class="ruler" id="evr"></div><b class="needle"></b></div><span class="v" id="evv">±0.0</span></div>
  <div class="controls">
    <button id="thumb" aria-label="写真"></button>
    <button id="shutter" aria-label="撮影"></button>
    <button class="round" id="flip" aria-label="カメラ切替"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.7"/><path d="M20 4v4.7h-4.7"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.3"/><path d="M4 20v-4.7h4.7"/></svg></button>
  </div>
</div>

<div id="editor">
  <div class="ebar">
    <button id="ecancel">キャンセル</button>
    <div id="einfo"></div>
    <button class="pri" id="esave">保存</button>
  </div>
  <div class="ewrap" id="ewrap">
    <canvas id="ecv"></canvas>
    <div class="meter" id="emeter"></div>
    <div id="ename"></div>
    <div id="ebusy">保存中…</div>
  </div>
  <div class="ehint">← 左右にスワイプで色味を切替 ／ 長押しで元の写真 →</div>
  <div class="looks" id="elooks"></div>
  <div id="etip"></div>
  <div class="row">EV <div class="rwrap"><div class="ruler" id="eevr"></div><b class="needle"></b></div><span class="v" id="eevv">±0.0</span></div>
  <div class="eopts">
    <button class="pill tg" id="eauto">AUTO</button>
    <button class="pill tg" id="emeterBtn">METER</button>
    <button class="pill tg" id="efilm">FILM</button>
    <button class="pill tg" id="eframe">FRAME</button>
    <button class="pill cyc" id="easp">3:2</button>
  </div>
</div>
<div id="viewer">
  <div class="imgwrap"><img id="vimg" alt=""></div>
  <div id="vinfo"></div>
  <div class="bar">
    <button id="vprev">‹</button>
    <button class="pri" id="vshare">共有 / 保存</button>
    <button id="vdl">ダウンロード</button>
    <button id="vnext">›</button>
    <button id="vclose">閉じる</button>
  </div>
</div>
<div id="toast"></div>
<video id="video" playsinline muted autoplay style="display:none"></video>
<input type="file" id="file" accept="image/*" multiple style="display:none">

<script>
"use strict";
// ===== Looks =====
// ライカ公式サイトの作例（Standardとの比較画像）から色変換を数値で推定した3D LUT
const LOOKS=[
  {name:"CLASSIC",      mono:0, tip:"迷ったらこれ。映画っぽく落ち着いた色"},
  {name:"CONTEMPORARY", mono:0, tip:"人物・ポートレートに。明るく自然な肌"},
  {name:"VIVID",        mono:0, tip:"晴れた日の景色・料理に。色しっかり"},

// ===== Shader =====
const VS=`attribute vec2 p;varying vec2 v_uv;void main(){v_uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const FS=`precision highp float;
varying vec2 v_uv;
uniform sampler2D u_tex,u_lut;
uniform vec4 u_crop;
uniform float u_look,u_nlooks,u_exp,u_grain,u_vig,u_seed,u_mirror,u_gsize,u_clar;
uniform vec3 u_wb;
uniform vec2 u_px;
uniform float u_nr;
uniform vec2 u_res;
uniform float u_look2,u_split,u_orig;
uniform vec4 u_tile;
uniform vec2 u_poff;
const float N=17.;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float luma(vec3 c){return dot(c,vec3(.2126,.7152,.0722));}
vec3 lut(vec3 c,float lk){
  c=clamp(c,0.,1.);
  float bz=c.b*(N-1.),b0=floor(bz),b1=min(b0+1.,N-1.),f=bz-b0;
  float x0=(b0*N+c.r*(N-1.)+.5)/(N*N),x1=(b1*N+c.r*(N-1.)+.5)/(N*N);
  float y=(lk*N+c.g*(N-1.)+.5)/(N*u_nlooks);
  return mix(texture2D(u_lut,vec2(x0,y)).rgb,texture2D(u_lut,vec2(x1,y)).rgb,f);
}
void main(){
  vec2 g=u_tile.xy+v_uv*u_tile.zw;   // 画像全体での位置（タイル分割描画用）
  vec2 uv=g; if(u_mirror>.5) uv.x=1.-uv.x;
  vec2 tuv=u_crop.xy+uv*u_crop.zw;
  vec3 c=texture2D(u_tex,tuv).rgb;
  if(u_orig>.5){gl_FragColor=vec4(c,1.);return;}
  // ノイズ低減：平らな所だけ周囲となじませる（輪郭は残す）
  if(u_nr>0.){
    vec3 s1=texture2D(u_tex,tuv+vec2(u_px.x,0.)).rgb,s2=texture2D(u_tex,tuv-vec2(u_px.x,0.)).rgb;
    vec3 s3=texture2D(u_tex,tuv+vec2(0.,u_px.y)).rgb,s4=texture2D(u_tex,tuv-vec2(0.,u_px.y)).rgb;
    vec3 s5=texture2D(u_tex,tuv+u_px).rgb,s6=texture2D(u_tex,tuv-u_px).rgb;
    vec3 s7=texture2D(u_tex,tuv+vec2(u_px.x,-u_px.y)).rgb,s8=texture2D(u_tex,tuv+vec2(-u_px.x,u_px.y)).rgb;
    vec3 nb=(s1+s2+s3+s4+s5+s6+s7+s8)*.125;
    float ed=max(max(length(s1-s2),length(s3-s4)),max(length(s5-s6),length(s7-s8)));
    float fl=1.-smoothstep(.04,.12,ed);
    c=mix(c,nb,u_nr*fl);
  }
  // 立体感（ローカルコントラスト）：周囲の平均との差を少し強調
  if(u_clar>0.){
    float ar0=u_res.x/u_res.y;
    vec2 d=vec2(.007/ar0,.007)*u_crop.zw;
    vec3 bl=vec3(0.);
    for(int i=0;i<12;i++){
      float a=float(i)*.5236; float rr=(i<6)?1.:.5;
      if(i>=6) a+=.2618;
      bl+=texture2D(u_tex,tuv+vec2(cos(a),sin(a))*d*rr*(i<6?1.:1.)).rgb;
    }
    bl/=12.;
    float dl=clamp(luma(c)-luma(bl),-.05,.05);   // 強い輪郭は強調しない（白フチ防止）
    c+=dl*u_clar*(1.-smoothstep(.75,1.,luma(c)))*smoothstep(0.,.12,luma(c));
  }
  // ホワイトバランス＋露出（リニア空間）
  vec3 l=pow(max(c,0.),vec3(2.2))*u_wb*exp2(u_exp);
  if(u_exp>0.){float k=.3*u_exp;l=l*(1.+k)/(1.+k*l);}
  c=pow(clamp(l,0.,1.),vec3(1./2.2));
  c=lut(c,(g.x<u_split)?u_look:u_look2);
  vec2 p=(g-.5)*2.; float ar=u_res.x/u_res.y; p.x*=ar;
  float r=length(p)/length(vec2(ar,1.));
  c*=1.-u_vig*pow(r,2.4);
  float n=hash(floor((gl_FragCoord.xy+u_poff)/u_gsize)+u_seed)-.5;
  float L2=luma(c); float w=1.-pow(abs(L2-.5)*2.,2.);
  c+=n*u_grain*(.35+.65*w);
  if(u_split<1.5&&abs(g.x-u_split)*u_res.x<1.5) c=vec3(1.);   // 比較の境目に白線
  gl_FragColor=vec4(clamp(c,0.,1.),1.);
}`;

class Renderer{
  constructor(canvas,keep){
    const gl=canvas.getContext("webgl",{preserveDrawingBuffer:!!keep,antialias:false,premultipliedAlpha:false});
    if(!gl) throw new Error("WebGL非対応");

function film(a){
  if(!S.film)return{grain:0,vig:0};
  const base=LOOKS[S.look].mono?{grain:.045,vig:.28}:{grain:.03,vig:.22};
  // 暗い場面（大きく持ち上げた時）は元のノイズが多いので粒子を控えめに
  const g=Math.max(0,(a?a.exp:0)+S.ev), k=Math.max(.15,1-.6*g);

// ===== おまかせ補正（ホワイトバランス・明るさ） =====
const ana=document.createElement("canvas");ana.width=64;ana.height=48;
const anaCtx=ana.getContext("2d",{willReadFrequently:true});
const AUTO={wb:[1,1,1],exp:0,ready:false};
function analyze(src,sw,sh){
  const W=64,H=Math.max(8,Math.round(64*sh/sw));ana.height=H;
  anaCtx.drawImage(src,0,0,W,H);
  const d=anaCtx.getImageData(0,0,W,H).data;
  const lin=v=>Math.pow(v/255,2.2);
  let sr=0,sg=0,sb=0,n=0;const Ls=[];
  for(let i=0;i<d.length;i+=4){
    const r=lin(d[i]),g=lin(d[i+1]),b=lin(d[i+2]);
    const y=.2126*r+.7152*g+.0722*b;Ls.push(y);
    if(y>.01&&Math.max(r,g,b)<.92){sr+=r;sg+=g;sb+=b;n++;}
  }
  let wb=[1,1,1];
  if(n>20){
    const m=(sr+sg+sb)/3;
    // 灰色仮説で色かぶりを推定し、7割だけ補正（雰囲気は少し残す）。ライカ寄りにわずかに暖色を残す
    const tgt=[1.02,1,.97];
    wb=[m/sr*tgt[0],m/sg*tgt[1],m/sb*tgt[2]].map(v=>Math.pow(v,.7));
    const gn=wb[1];wb=wb.map(v=>Math.min(1.6,Math.max(.65,v/gn)));

  Ls.sort((a,b)=>a-b);
  const p98=Ls[Math.floor(Ls.length*.98)]*1.0, p50=Ls[Math.floor(Ls.length*.5)];
  // 一番明るい所が白に近づくように（上げすぎ・下げすぎは制限）
  const p95=Ls[Math.floor(Ls.length*.95)];
  // 中間の明るさを基準に決め、明るい部分（窓など）は多少白く飛んでもよい（逆光対策）
  const eMid=Math.log2(.13/Math.max(p50,1e-4));
  const eHi=Math.log2(.9/Math.max(p95,1e-3))+.8;
  let e=Math.min(eMid,eHi),mode=eMid<=eHi?"mid":"hi";
  if(e>1.6)mode="max";if(e<-1)mode="min";
  e=Math.max(-1,Math.min(1.6,e));
  return{wb,exp:e,mode};
}

const mcv=document.createElement("canvas");mcv.width=80;mcv.height=60;
const mctx=mcv.getContext("2d",{willReadFrequently:true});
function measure(src){
  const W=80,H=Math.max(8,Math.round(80*src.height/Math.max(1,src.width)));mcv.height=H;
  mctx.drawImage(src,0,0,W,H);
  const d=mctx.getImageData(0,0,W,H).data,Ls=[],hist=new Array(48).fill(0);

const fmtEV=v=>(v>0.049?"+":v<-0.049?"−":"±")+Math.abs(v).toFixed(1);

<div class="mr"><small>EV</small><span data-k="ev"></span></div>
<div class="mr"><small>WB</small><div class="wbbar"><i data-k="wbdot"></i></div><span data-k="wb"></span></div>`;

function layout(){
  const vw=video.videoWidth||1280,vh=video.videoHeight||720;
  const A=targetAspect(vw,vh);
  const r=stage.getBoundingClientRect(),land=LAND.matches;
  // 縦画面は全面表示：ヘッダーのすぐ下から、横幅いっぱいに出す（下の操作部には半透明で重なる）
  let top0=0,bot=r.height;
  if(!land){top0=document.querySelector("header").getBoundingClientRect().bottom-r.top;bot=$("looks").getBoundingClientRect().top-r.top;}
  const avH=r.height-top0;
  let w,h; if(r.width/avH>A){h=avH;w=h*A;}else{w=r.width;h=w/A;}
  const left=(r.width-w)/2,top=land?(r.height-h)/2:top0+Math.max(0,(bot-top0-h)/2);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  view.style.width=w+"px";view.style.height=h+"px";
  view.style.left=land?"":left+"px";view.style.top=land?"":top+"px";
  view.width=Math.round(w*dpr);view.height=Math.round(h*dpr);
  ["grid","vf"].forEach(id=>{const g=$(id);g.style.width=w+"px";g.style.height=h+"px";
    g.style.left=left+"px";g.style.top=top+"px";});

async function processImage(src,sw,sh,mirror,auto,mpMax,rot){

  const full=document.createElement("canvas");full.width=OW;full.height=OH;

  }
  if(S.frame) out=addFrame(out,L.name);
  const blob=await new Promise(res=>out.toBlob(res,"image/jpeg",0.93));
  blob.w=out.width;blob.h=out.height;
  return blob;
}

function addFrame(src,lookName){
  const W=src.width,H=src.height,s=Math.min(W,H);
  const side=Math.round(s*.035),bottom=Math.round(s*.11);
  const c=document.createElement("canvas");c.width=W+side*2;c.height=H+side+bottom;
  const x=c.getContext("2d");
  x.fillStyle="#f7f6f2";x.fillRect(0,0,c.width,c.height);
  x.drawImage(src,side,side);
  const y=side+H+bottom/2,fs=Math.round(bottom*.2);
  x.textBaseline="middle";
  x.fillStyle="#ff7a1a";x.beginPath();x.arc(side+fs*.4,y,fs*.3,0,Math.PI*2);x.fill();
  x.fillStyle="#1a1a1a";x.textAlign="left";x.font=`600 ${fs}px -apple-system,"Helvetica Neue",Arial,sans-serif`;
  x.fillText("UTSUSHI",side+fs*1.1,y);
  const d=new Date(),pad=n=>String(n).padStart(2,"0");
  x.fillStyle="#7a7a7a";x.textAlign="right";x.font=`400 ${Math.round(fs*.82)}px -apple-system,"Helvetica Neue",Arial,sans-serif`;
  x.fillText(`${lookName}   ${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`,side+W,y);
  return c;
}

async function capture(){
  if(S.busy||!S.track||!EX) return;
  S.busy=true;$("shutter").classList.add("busy");
  const f=$("flash");f.style.opacity=.85;setTimeout(()=>f.style.opacity=0,120);
  if(navigator.vibrate) navigator.vibrate(15);
  try{
    let src=video,sw=video.videoWidth,sh=video.videoHeight;
    // 背面カメラは高解像度の静止画を試す（Android Chromeなど）
    if(S.facing==="environment"&&"ImageCapture" in window){
      try{
        const ic=new ImageCapture(S.track);
        // 最大解像度で撮影を試す（非対応なら通常撮影）
        let opt;
        try{const pc=await timeout(ic.getPhotoCapabilities(),1500);if(pc&&pc.imageWidth&&pc.imageHeight)opt={imageWidth:pc.imageWidth.max,imageHeight:pc.imageHeight.max};}catch(e){}
        let blob;
        try{blob=await timeout(ic.takePhoto(opt),4000);}catch(e){if(!opt)throw e;blob=await timeout(ic.takePhoto(),3500);}
        let bmp;try{bmp=await createImageBitmap(blob,{imageOrientation:"from-image"});}catch(e){bmp=await createImageBitmap(blob);}
        if((bmp.width>bmp.height)===(sw>sh)&&bmp.width*bmp.height>sw*sh){src=bmp;sw=bmp.width;sh=bmp.height;}
      }catch(e){}
    }
    const out=await processImage(src,sw,sh,S.facing==="user",AUTO.ready?{wb:AUTO.wb.slice(),exp:AUTO.exp}:null,null,devRot);
    addShot(out);
    toast("撮影しました");
  }catch(e){toast("撮影に失敗："+e.message);}
  S.busy=false;$("shutter").classList.remove("busy");
}

function fname(){const d=new Date(),p=n=>String(n).padStart(2,"0");return `UTSUSHI_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}_${Math.floor(Math.random()*90+10)}.jpg`;}
function addShot(blob){
  const url=URL.createObjectURL(blob);
  S.shots.push({blob,url,name:fname(),look:LOOKS[S.look].name,w:blob.w,h:blob.h});
  $("thumb").style.backgroundImage=`url(${url})`;
}

function showShot(){const s=S.shots[S.vi];$("vimg").src=s.url;$("vinfo").textContent=`${S.vi+1} / ${S.shots.length}　${s.look}　${s.w}×${s.h}（${(s.w*s.h/1e6).toFixed(1)}MP）`;}

// ===== 編集画面（読み込んだ写真に色味をつける） =====
const E={queue:[],bmp:null,prev:null,auto:null,drag:null,hold:null,orig:false,saved:0};
let ED=null;
function edRenderer(){
  if(ED)return ED;
  ED=new Renderer($("ecv"),false);if(lutImg.complete&&lutImg.naturalWidth)ED.setLut(lutImg);return ED;

async function nextEdit(){

  $("einfo").textContent="読み込み中…";
  try{
    let bmp;try{bmp=await createImageBitmap(f,{imageOrientation:"from-image"});}catch(er){bmp=await createImageBitmap(f);}
    if(E.bmp&&E.bmp.close)E.bmp.close();
    E.bmp=bmp;
    // 画面用の縮小版（長辺2048px）
    const k=Math.min(1,2048/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    E.prev=c;E.auto=analyze(c,c.width,c.height);
    const r=edRenderer();r.upload(c);
    $("einfo").textContent=`${bmp.width}×${bmp.height}（${(bmp.width*bmp.height/1e6).toFixed(0)}MP）`+(E.queue.length?`　残り${E.queue.length}枚`:"");
    edLayout();edRender();edRenderUI();flashName(LOOKS[S.look].name);

function closeEditor(){
  $("editor").classList.remove("on");

}
function edLayout(){
  if(!E.prev)return;
  const w0=E.prev.width,h0=E.prev.height,cr=cropFor(w0,h0);
  const A=(w0*cr[2])/(h0*cr[3]);
  const r=$("ewrap").getBoundingClientRect();
  let w,h;if(r.width/r.height>A){h=r.height-8;w=h*A;}else{w=r.width-8;h=w/A;}
  const dpr=Math.min(window.devicePixelRatio||1,2),cv=$("ecv");
  cv.style.width=w+"px";cv.style.height=h+"px";cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
}
function edRender(){
  if(!ED||!E.prev||!ED.lutReady)return;
  const w0=E.prev.width,h0=E.prev.height,a=E.auto;
  const A=autoParams(a),F=film(S.auto?a:null);
  const nrk=Math.max(1,Math.max(w0,h0)/1600);
  const o={crop:cropFor(w0,h0),look:S.look,exp:A.exp,wb:A.wb,clar:A.clar,nr:A.nr,px:[nrk/w0,nrk/h0],
    grain:F.grain,vig:F.vig,seed:7.3,mirror:false,gsize:Math.max(1,Math.max(ED.c.width,ED.c.height)/1800),orig:E.orig};
  const d=E.drag;
  if(d&&d.dx){
    const n=LOOKS.length,W=ED.c.clientWidth||1;
    if(d.dx<0){o.look2=(S.look+1)%n;o.split=1+d.dx/W;}           // 右から次の色味
    else{o.look=(S.look-1+n)%n;o.look2=S.look;o.split=d.dx/W;}    // 左から前の色味
  }
  ED.draw(o);
  if(S.meter&&!E.orig){try{editMeter.update(measure(ED.c),a);}catch(e){}}
}
function flashName(t){const e=$("ename");e.textContent=t;e.style.opacity=1;clearTimeout(flashName.t);flashName.t=setTimeout(()=>e.style.opacity=0,900);}
function edRenderUI(){
  const box=$("elooks");box.innerHTML="";
  LOOKS.forEach((l,i)=>{const b=document.createElement("button");b.className="chip"+(i===S.look?" on":"");b.textContent=l.name;
    b.onclick=()=>{setEdLook(i);};box.appendChild(b);});
  const on=box.children[S.look];if(on&&on.scrollIntoView)on.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
  $("etip").textContent=LOOKS[S.look].tip;
  eevRuler.sync();
  $("emeterBtn").classList.toggle("on",S.meter);$("emeter").classList.toggle("on",S.meter);
  $("eauto").classList.toggle("on",S.auto);$("efilm").classList.toggle("on",S.film);$("eframe").classList.toggle("on",S.frame);
  $("easp").textContent=ASPECTS[S.aspect].label;
}
function setEdLook(i){S.look=i;persist();renderLooks();renderToggles();edRenderUI();edRender();flashName(LOOKS[i].name);}
// スワイプ・長押し
(function(){
  const el=$("ewrap");
  el.addEventListener("pointerdown",e=>{
    if(!E.prev)return;el.setPointerCapture(e.pointerId);
    E.drag={x0:e.clientX,y0:e.clientY,dx:0,moved:false};
    clearTimeout(E.hold);E.hold=setTimeout(()=>{if(E.drag&&!E.drag.moved){E.orig=true;edRender();flashName("ORIGINAL");}},350);
  });
  el.addEventListener("pointermove",e=>{
    const d=E.drag;if(!d)return;
    const dx=e.clientX-d.x0;
    if(Math.abs(dx)>8)d.moved=true;
    if(E.orig)return;
    if(d.moved){d.dx=Math.max(-ED.c.clientWidth,Math.min(ED.c.clientWidth,dx));edRender();}
  });
  const end=e=>{
    const d=E.drag;clearTimeout(E.hold);E.drag=null;
    if(E.orig){E.orig=false;edRender();return;}
    if(!d)return;
    const W=ED.c.clientWidth||1,n=LOOKS.length;
    if(Math.abs(d.dx)>W*.25) setEdLook(d.dx<0?(S.look+1)%n:(S.look-1+n)%n);
    else edRender();
  };
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
})();
$("ecancel").onclick=()=>{E.queue=[];closeEditor();};
$("emeterBtn").onclick=()=>{S.meter=!S.meter;persist();renderToggles();edRenderUI();edRender();};
$("eauto").onclick=()=>{S.auto=!S.auto;persist();renderToggles();edRenderUI();edRender();};
$("efilm").onclick=()=>{S.film=!S.film;persist();renderToggles();edRenderUI();edRender();};

$("easp").onclick=()=>{S.aspect=(S.aspect+1)%ASPECTS.length;persist();renderToggles();edRenderUI();edLayout();edRender();};
$("esave").onclick=async()=>{
  if(!E.bmp)return;
  $("ebusy").style.display="flex";await new Promise(r=>setTimeout(r,30));
  const b=E.bmp,a=E.auto;
  let blob=null;
  try{blob=await processImage(b,b.width,b.height,false,a);}
  catch(er){

    catch(er2){try{blob=await processImage(b,b.width,b.height,false,a,12);toast("容量が大きすぎたため12MPで保存しました");}catch(er3){toast("保存に失敗："+er3.message);}}
  }
  $("ebusy").style.display="none";
  if(blob){addShot(blob);E.saved++;
    // 自動で端末に保存（共有シート or ダウンロード）
    download(S.shots[S.shots.length-1]);
    nextEdit();
  }
};
window.addEventListener("resize",()=>{if($("editor").classList.contains("on"))setTimeout(()=>{edLayout();edRender();},120);});

// ===== UI =====
function toast(t){const e=$("toast");e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1600);}
function renderLooks(){
  const box=$("looks");box.innerHTML="";
  LOOKS.forEach((l,i)=>{const b=document.createElement("button");b.className="chip"+(i===S.look?" on":"");b.textContent=l.name;
    b.onclick=()=>{S.look=i;persist();renderLooks();renderToggles();if(navigator.vibrate)navigator.vibrate(5);};box.appendChild(b);});
  const on=box.children[S.look];if(on&&on.scrollIntoView)on.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
}
// EVダイヤル：目盛りを左右にスクロールして0.1刻みで合わせる（ダブルタップで0に戻す）
function makeRuler(el,valEl,onSet){
  const STEP=10,MIN=-15,MAX=15;
  const tr=document.createElement("div");tr.className="rtrack";
  for(let i=MIN;i<=MAX;i++){const t=document.createElement("span");
    t.className="tk"+(i%5===0?" mj":"")+(i===0?" z":"");
    if(i%5===0)t.dataset.l=i===0?"0":(i>0?"+":"−")+Math.abs(i/10);
    tr.appendChild(t);}
  el.appendChild(tr);
  let touching=false,lastW=0,st=null;
  const pad=()=>{const w=el.clientWidth;if(w&&w!==lastW){lastW=w;tr.style.padding=`0 ${w/2-STEP/2}px`;}return w;};
  const show=v=>{valEl.textContent=fmtEV(v);};
  const R={sync(){if(!pad())return;show(S.ev);if(touching)return;
      const x=Math.round(S.ev*10-MIN)*STEP;if(Math.abs(el.scrollLeft-x)>1)el.scrollLeft=x;}};
  el.addEventListener("scroll",()=>{
    if(!lastW)return;
    const k=Math.max(0,Math.min(MAX-MIN,Math.round(el.scrollLeft/STEP))),v=Math.round(k+MIN)/10;
    if(Math.abs(v-S.ev)>.001){show(v);onSet(v);if(touching&&navigator.vibrate)navigator.vibrate(3);}
  },{passive:true});
  el.addEventListener("touchstart",()=>{touching=true;clearTimeout(st);},{passive:true});
  el.addEventListener("touchend",()=>{clearTimeout(st);st=setTimeout(()=>{touching=false;},600);},{passive:true});
  el.addEventListener("pointerdown",()=>{touching=true;clearTimeout(st);});
  el.addEventListener("pointerup",()=>{clearTimeout(st);st=setTimeout(()=>{touching=false;},600);});
  let lt=0;el.addEventListener("click",()=>{const t=Date.now();if(t-lt<300){touching=false;onSet(0);R.sync();}lt=t;});
  window.addEventListener("resize",()=>setTimeout(()=>R.sync(),150));
  return R;
}
const evRuler=makeRuler($("evr"),$("evv"),v=>{S.ev=v;persist();renderToggles();});
const eevRuler=makeRuler($("eevr"),$("eevv"),v=>{S.ev=v;persist();renderToggles();edRender();});
const mainMeter=makeMeter($("meter")),editMeter=makeMeter($("emeter"));
function renderToggles(){
  $("aspectBtn").textContent=ASPECTS[S.aspect].label;
  $("resBtn").textContent=(RES[S.res]||RES[0]).label;
  $("gridBtn").classList.toggle("on",S.grid);$("grid").classList.toggle("on",S.grid);
  $("frameBtn").classList.toggle("on",S.frame);
  $("autoBtn").classList.toggle("on",S.auto);

  $("filmBtn").classList.toggle("on",S.film);
  $("meterBtn").classList.toggle("on",S.meter);$("meter").classList.toggle("on",S.meter);
  evRuler.sync();renderVfbar();
}
$("aspectBtn").onclick=()=>{S.aspect=(S.aspect+1)%ASPECTS.length;persist();renderToggles();layout();};
$("resBtn").onclick=()=>{S.res=(S.res+1)%RES.length;persist();renderToggles();toast("解像度："+RES[S.res].label);};
$("gridBtn").onclick=async()=>{S.grid=!S.grid;persist();if(S.grid)await startLevel();renderToggles();};
$("autoBtn").onclick=()=>{S.auto=!S.auto;persist();renderToggles();toast(S.auto?"おまかせ補正：ON（色かぶり・明るさを自動で整えます）":"おまかせ補正：OFF");};
$("filmBtn").onclick=()=>{S.film=!S.film;persist();renderToggles();toast(S.film?"粒子・周辺減光：ON":"粒子・周辺減光：OFF");};
$("frameBtn").onclick=()=>{S.frame=!S.frame;persist();renderToggles();toast(S.frame?"白フチ：ON":"白フチ：OFF");};
$("meterBtn").onclick=()=>{S.meter=!S.meter;persist();renderToggles();toast(S.meter?"測光メーター：ON（いまの明るさ・AUTOの補正量を表示）":"測光メーター：OFF");};
$("shutter").onclick=capture;
$("thumb").onclick=()=>openViewer(S.shots.length-1);
$("flip").onclick=()=>{S.facing=S.facing==="environment"?"user":"environment";persist();startCamera();};
document.addEventListener("keydown",e=>{if((e.key===" "||e.key==="AudioVolumeUp"||e.key==="AudioVolumeDown")&&!$("viewer").classList.contains("on")){e.preventDefault();capture();}});
window.addEventListener("resize",()=>setTimeout(layout,100));
video.addEventListener("loadedmetadata",layout);video.addEventListener("resize",()=>setTimeout(layout,50));
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopCamera();else if(!$("editor").classList.contains("on"))startCamera();});

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
// ===== 水平器（グリッドON時に表示。水平になるとオレンジ） =====
let levelOn=false,levelStarted=false;
// 本体の向き（画面が縦のまま本体だけ横にした時に、保存写真を回転させる）
let devRot=0;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function onMotion(e){
  const g0=e.accelerationIncludingGravity;if(!g0||g0.x==null)return;
  const sg=isIOS?-1:1,gx=g0.x*sg,gy=g0.y*sg,gz=g0.z*sg;
  const ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
  // 本体の向き判定（画面が回転していない時だけ）
  let nr=devRot;
  if(Math.abs(gz)<8.5){
    if(Math.abs(gx)>Math.abs(gy)*1.4&&Math.abs(gx)>4) nr=gx>0?-90:90;
    else if(Math.abs(gy)>Math.abs(gx)*1.4) nr=0;
  }
  if(ang!==0) nr=0;
  if(nr!==devRot){devRot=nr;document.body.dataset.rot=devRot;}
  // 水平器
  if(Math.abs(gz)>8.5){levelOn=false;$("level").style.display="none";return;}
  let a=Math.atan2(gx,gy)*180/Math.PI;
  a=((a+ang+540)%360)-180;
  const base=Math.round(a/90)*90, dev=a-base;
  levelOn=true;const el=$("level");el.style.display=S.grid?"block":"none";
  el.style.transform=`translate(-50%,-50%) rotate(${-a}deg)`;el.classList.toggle("ok",Math.abs(dev)<1.2);
}
let motionOn=false;
async function startMotion(){
  if(motionOn)return;
  try{if(typeof DeviceMotionEvent!=="undefined"&&DeviceMotionEvent.requestPermission){const r=await DeviceMotionEvent.requestPermission();if(r!=="granted")return;}}catch(e){return;}
  motionOn=true;window.addEventListener("devicemotion",onMotion);
}
async function startLevel(){return startMotion();}
// Androidは許可不要なので最初から開始。iPhone/iPadは最初のタップで許可を求める
if(!(typeof DeviceMotionEvent!=="undefined"&&DeviceMotionEvent.requestPermission))startMotion();
else document.addEventListener("pointerup",()=>startMotion(),{once:true});
renderLooks();renderToggles();
if(R){startCamera();requestAnimationFrame(loop);}
